[project]
name = "csm-ml"
version = "0.0.0"
description = "Service ML CSM: cek Serial No, worker ekstraksi VLM (Hugging Face), koreksi NLP. Lihat docs/PRD-v2.md §6, §9."
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary]>=3.2",
  "openai>=1.50",
  "rapidfuzz>=3.9",
  "pydantic>=2.8",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "openpyxl>=3.1", "pypdfium2>=4.30", "pillow>=10"]
# Alat spike Fase 0 (tidak ikut image produksi): baca workbook label & pecah PDF.
spike = ["openpyxl>=3.1", "pypdfium2>=4.30", "pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csm_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
